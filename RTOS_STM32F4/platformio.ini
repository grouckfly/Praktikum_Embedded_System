[env:disco_f407vg]
platform = ststm32
board = disco_f407vg
framework = stm32cube
build_flags =
    -mthumb
    -mcpu=cortex-m4
    -mfpu=fpv4-sp-d16
    -mfloat-abi=hard
extra_scripts = pre:extra_script.py
lib_deps = 
    mincrmatt12/STM32Cube Middleware-FreeRTOS @ ~10.3.1
custom_freertos_config_location = include/FreeRTOSConfig.h
